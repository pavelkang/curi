<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@700&family=Manrope:wght@700&family=Plus+Jakarta+Sans:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:sans-serif;padding:40px;font-size:24px} .row{margin:12px 0}</style></head>
<body><h1>Font load test</h1><div id="results">waiting for fonts.ready…</div>
<script>
(async () => {
  const fonts = ["Plus Jakarta Sans", "Inter", "Manrope", "Space Grotesk", "Fraunces"];
  try {
    await Promise.all(fonts.map(f => document.fonts.load('700 72px "' + f + '"')));
    await document.fonts.ready;
  } catch (e) { document.getElementById('results').textContent = 'ERROR: ' + e; return; }
  const lines = fonts.map(f => {
    const check = document.fonts.check('700 72px "' + f + '"');
    return f + ': fonts.check=' + check;
  });
  document.getElementById('results').innerHTML = lines.map(l => '<div class="row">' + l + '</div>').join('');
  document.title = 'DONE';
})();
</script></body></html>
